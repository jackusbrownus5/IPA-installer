<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Upload IPA</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body { font-family:-apple-system,BlinkMacSystemFont,sans-serif; background:#f7f7f7; text-align:center; padding:50px; }
.card { background:white; border-radius:14px; padding:30px; max-width:400px; margin:0 auto; box-shadow:0 10px 25px rgba(0,0,0,0.1); }
input[type=file] { margin-top:15px; }
button { margin-top:20px; padding:12px 20px; background:#007aff; color:white; border:none; border-radius:12px; font-weight:600; cursor:pointer; }
.error { color:#d00; margin-top:15px; }
</style>
</head>
<body>
<div class="card">
<h2>Upload Signed IPA</h2>
<form action="/upload" method="post" enctype="multipart/form-data">
<input type="file" name="ipa" accept=".ipa" required>
<br>
<button type="submit">Upload</button>
</form>
{% if error %}
<p class="error">{{ error }}</p>
{% endif %}
</div>
</body>
</html>
