<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Install {{ title }}</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body { font-family:-apple-system,BlinkMacSystemFont,sans-serif; background:#f0f0f5; text-align:center; padding:50px; }
.card { background:white; border-radius:14px; padding:30px; max-width:400px; margin:0 auto; box-shadow:0 10px 25px rgba(0,0,0,0.1); }
.btn { padding:14px 24px; border-radius:14px; background:#007aff; color:white; border:none; font-weight:600; cursor:pointer; font-size:16px; }
#overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35); display:flex; align-items:center; justify-content:center; }
.popup { width:300px; background:#fff; border-radius:16px; padding:20px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,0.25); }
.popup h3 { margin:10px 0; font-size:18px; }
.popup p { font-size:14px; color:#444; margin:10px 0 20px; }
.actions { display:flex; gap:10px; justify-content:center; }
.btn.cancel { background:#f1f1f1; color:#333; }
</style>
</head>
<body>
<div class="card">
<h2>{{ title }}</h2>
<p>Tap below to install the app on iOS</p>
<button class="btn" id="installBtn">Install App</button>
</div>

<!-- Popup -->
<div id="overlay">
<div class="popup">
<h3>Install "{{ title }}"?</h3>
<p>This will download and install the app on your device. Continue?</p>
<div class="actions">
<button class="btn cancel" id="cancelBtn">Cancel</button>
<button class="btn" id="confirmBtn">Install</button>
</div>
</div>
</div>

<script>
const overlay = document.getElementById('overlay');
document.getElementById('installBtn').onclick = () => overlay.style.display='flex';
document.getElementById('cancelBtn').onclick = () => overlay.style.display='none';
document.getElementById('confirmBtn').onclick = () => {
    overlay.style.display='none';
    window.location.href = "{{ install_link }}";
}
</script>
</body>
</html>
